name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install and build client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Install and build server
        working-directory: server
        run: |
          npm ci
          npm run build
